server:
  port: 8085
  tomcat:
    max-swallow-size: 500MB
    max-http-form-post-size: 500MB
  error:
    include-message: always
    include-stacktrace: always
spring:
  application:
    name: marketplace-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/marketplacedb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      uri: ${MARKETPLACE_MONGO_URI:${MONGO_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MARKETPLACE_MONGO_DATABASE:jivathunai_marketplace}}}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
