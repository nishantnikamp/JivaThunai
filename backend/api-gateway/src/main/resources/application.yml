server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  codec:
    max-in-memory-size: 500MB
  webflux:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**, /api/v1/admin/**, /api/v1/profile/**, /api/v1/users/**, /api/v1/kyc/**, /api/v1/invitations/**, /api/v1/public/**
        - id: pet-profile-service
          uri: lb://PET-PROFILE-SERVICE
          predicates:
            - Path=/api/v1/pets/**, /api/v1/pet-profile/**
        - id: marketplace-service
          uri: lb://MARKETPLACE-SERVICE
          predicates:
            - Path=/api/v1/marketplace/**, /ws/marketplace/**, /api/v1/pets-for-sale/**, /api/v1/petproduct/**, /api/v1/pet/**, /api/v1/products/**, /api/v1/media/**, /api/v1/reviews/**
        - id: adoption-service
          uri: lb://ADOPTION-SERVICE
          predicates:
            - Path=/api/v1/adoptions/**, /api/v1/compliance/**
        - id: payment-wallet-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/payments/**, /api/v1/wallet/**, /api/v1/orders/**
        - id: notification-engine
          uri: lb://NOTIFICATION-ENGINE
          predicates:
            - Path=/api/v1/notifications/**
        - id: medical-health-service
          uri: lb://MEDICAL-HEALTH-SERVICE
          predicates:
            - Path=/api/v1/medical/**, /api/v1/vet-appointments/**, /api/v1/bookings/**, /api/v1/clinical/**, /api/v1/emergency/**, /api/v1/vet/**, /ws/medical/**


jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.jivathunai.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
